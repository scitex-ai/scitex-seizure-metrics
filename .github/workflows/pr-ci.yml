name: pr-ci

# Consolidated PR-only CI gate. Runs the per-PR validation suite as a
# single workflow so the cancel-in-progress concurrency group, path
# filters, and uv cache apply uniformly. Post-merge validation lives
# in release-ci.yml.
#
# L1 concurrency — cancel superseded PR runs.
# L3 path filters — skip docs/skills/examples/markdown-only PRs.
# L4 conditional matrix — full ["3.11", "3.12", "3.13"] on PR (this trigger).
# L5a uv-managed Python (`uv python install` + `uv venv --python`) so the
#     matrix leg is not bound to the runner's system Python.
# L5b .venv/bin on PATH (and explicit `.venv/bin/python` for clarity) so
#     console scripts resolve without needing `uv run`.
#
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# `import-smoke` and `audit` (renamed `quality-audit`) converted to thin
# `uses:` stubs — their bodies matched the reusable workflows exactly.
# `tests` is LEFT ALONE: its matrix is conditional on
# `github.event_name == 'pull_request'` (full 3-version matrix on PR,
# single 3.12 on workflow_dispatch) — the reusable pytest-matrix.yml always
# runs the full matrix unconditionally, so migrating would silently change
# workflow_dispatch behavior. `dep-hygiene-smoke` is LEFT ALONE: no
# reusable-workflow counterpart exists for the bare (no `-e`) install check.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '_skills/**'
      - 'examples/**'
      - '**.md'
      - 'CHANGELOG.*'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  import-smoke:
    # PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit
  dep-hygiene-smoke:
    name: dep-hygiene-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.11 (uv-managed)
        run: uv python install 3.11
      - name: Bare install (no extras) in uv venv
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python .
      - name: Import package
        run: .venv/bin/python -c "import scitex_seizure_metrics; print(scitex_seizure_metrics.__name__)"

  tests:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.11", "3.12", "3.13"]') || fromJson('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python ${{ matrix.python-version }} (uv-managed)
        run: uv python install ${{ matrix.python-version }}
      - name: Create uv venv on this matrix Python
        run: uv venv --python ${{ matrix.python-version }} .venv
      - name: Install dependencies
        # Fallback chain: prefer [all,dev] so optional-dep code paths
        # get exercised. Falls back to [dev] then plain editable so a
        # packaging hiccup doesn't strand CI.
        run: |
          uv pip install --python .venv/bin/python -e ".[all,dev]" \
            || uv pip install --python .venv/bin/python -e ".[dev]" \
            || uv pip install --python .venv/bin/python -e .
      - name: Run tests
        # PATH prepend so any test that subprocess-calls a console script
        # finds it in .venv/bin/.
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/pytest tests/ --cov=src/scitex_seizure_metrics --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  quality-audit:
    # PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
    # New required-status-check context: "quality-audit / audit"
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
