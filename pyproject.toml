[project]
name = "scitex-seizure-metrics"
version = "0.1.3"
description = "Standardised evaluation metrics for epileptic seizure detection and forecasting."
authors = [{ name = "Yusuke Watanabe", email = "ywata1989@gmail.com" }]
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["epilepsy", "seizure", "forecasting", "evaluation", "metrics", "EEG", "iEEG", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "timescoring>=0.0.5",
]

[project.optional-dependencies]
plots = ["matplotlib"]
# `scitex-session`/`figrecipe` back the runnable examples: `examples/06_*.py`
# uses `@stx.session` (the standalone session lib — NOT the `scitex` umbrella,
# which PS-139 bans), `examples/03_*.ipynb` uses figrecipe. The example tests
# import them, so they ride in the test/dev/all extras CI installs.
#
# The jupyter toolchain (nbconvert/nbformat/ipykernel) needed to *execute*
# notebooks lives only in the `notebooks` extra — deliberately NOT in
# test/dev/all. The `tests/examples/test_0*_*.ipynb` smoke tests
# `pytest.importorskip("nbconvert")`, so absent the toolchain they skip
# (matching the established CI baseline). Pulling them into the CI venv
# un-skips those tests, which then fail on a pre-existing harness bug:
# `subprocess.run([sys.executable, "-m", "jupyter", "nbconvert", ...])`
# resolves `jupyter` from `~/.local/bin` on the self-hosted runner (outside
# the venv) where `nbconvert` is absent. The committed notebook outputs
# (PS-504) are produced with this extra installed locally.
examples = ["scitex-session", "figrecipe", "matplotlib"]
notebooks = ["nbformat", "nbconvert", "ipykernel"]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "matplotlib",
    "scitex-session",
    "figrecipe",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout",
    "ruff",
    "scitex-dev>=0.11.7",
    "matplotlib",
    "scitex-session",
    "figrecipe",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-parser",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-seizure-metrics[plots]",
    "scitex-seizure-metrics[docs]",
    "scitex-seizure-metrics[dev]",
    "scitex-seizure-metrics[examples]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-seizure-metrics"
Repository = "https://github.com/ywatanabe1989/scitex-seizure-metrics"
Documentation = "https://scitex-seizure-metrics.readthedocs.io"
Issues = "https://github.com/ywatanabe1989/scitex-seizure-metrics/issues"
Changelog = "https://github.com/ywatanabe1989/scitex-seizure-metrics/blob/main/CHANGELOG.md"

[project.entry-points."scitex_dev.docs"]
scitex_seizure_metrics = "scitex_seizure_metrics"

[project.entry-points."scitex_dev.skills"]
scitex_seizure_metrics = "scitex_seizure_metrics"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_seizure_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/scitex_seizure_metrics/__init__.py" = ["E402", "F401"]
"src/scitex_seizure_metrics/**/__init__.py" = ["F401"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]
