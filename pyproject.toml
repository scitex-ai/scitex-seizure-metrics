[project]
name = "epileval"
version = "0.1.0"
description = "Standardised evaluation metrics for epileptic seizure detection and forecasting."
authors = [{ name = "Yusuke Watanabe", email = "ywata1989@gmail.com" }]
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["epilepsy", "seizure", "forecasting", "evaluation", "metrics", "EEG", "iEEG", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "timescoring>=0.0.5",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "matplotlib"]
plots = ["matplotlib"]
docs = ["sphinx>=7", "furo", "myst-parser"]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/epileval"
Repository = "https://github.com/ywatanabe1989/epileval"
Documentation = "https://epileval.readthedocs.io"
Issues = "https://github.com/ywatanabe1989/epileval/issues"
Changelog = "https://github.com/ywatanabe1989/epileval/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epileval"]
